name: Validate product
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: local-integration-test
          POSTGRES_DB: forge_integration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forge -d forge_integration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-integration-test
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: forge_integration_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run setup:web
      - name: Check diagram fallbacks and source previews
        run: node scripts/render_diagrams.mjs --check
      - name: Check public source
        run: python3 scripts/check_publication.py
      - name: Audit both dependency trees
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix apps/web --audit-level=moderate
      - run: make test
      - name: Start disposable authenticated MongoDB
        env:
          TEST_MONGODB_URL: mongodb://forge:local-integration-test@127.0.0.1:27017/forge_integration_test?authSource=admin&replicaSet=rs0&directConnection=true
        run: |
          mkdir -p .forge/ci
          openssl rand -base64 756 > .forge/ci/mongodb-keyfile
          chmod 400 .forge/ci/mongodb-keyfile
          sudo chown 999:999 .forge/ci/mongodb-keyfile
          # Disposable CI only: use per-thread allocator caches on hosted kernels
          # affected by MongoDB SERVER-121912. Authentication stays enabled.
          # https://www.mongodb.com/docs/manual/administration/tcmalloc-performance/
          docker run -d --name forge-mongodb -p 127.0.0.1:27017:27017 --mount type=bind,source="$PWD/.forge/ci/mongodb-keyfile",target=/run/mongodb-keyfile,readonly -e GLIBC_TUNABLES=glibc.pthread.rseq=1 -e MONGO_INITDB_ROOT_USERNAME=forge -e MONGO_INITDB_ROOT_PASSWORD=local-integration-test mongo:8.0 --replSet rs0 --bind_ip_all --keyFile /run/mongodb-keyfile
          if ! node scripts/prepare_test_mongodb.mjs; then
            docker inspect forge-mongodb --format '{{json .State}}'
            docker logs --tail 60 forge-mongodb
            exit 1
          fi
      - name: PostgreSQL, MySQL and MongoDB data contracts
        env:
          TEST_DATABASE_URL: postgresql://forge:local-integration-test@127.0.0.1:5432/forge_integration_test
          TEST_MYSQL_URL: mysql://root:local-integration-test@127.0.0.1:3306/forge_integration_test
          TEST_MONGODB_URL: mongodb://forge:local-integration-test@127.0.0.1:27017/forge_integration_test?authSource=admin&replicaSet=rs0&directConnection=true
        run: npm run test:integration
      - name: Remove disposable MongoDB
        if: always()
        run: docker rm -f forge-mongodb 2>/dev/null || true
      - run: npm run build:web
      - run: npm run package:worker
      - name: Validate Terraform and mocked security contracts
        run: |
          ./forge check
          make terraform-test
      - name: Build and check bilingual website
        run: |
          npm run site
          python3 scripts/check_site.py
          python3 scripts/check_publication.py --artifacts dist
      - run: npx playwright install --with-deps chromium
      - name: Test website and Next.js reference application
        run: npm run test:site
